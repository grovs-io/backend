# Self-hosted stack: PostgreSQL, Redis, ClickHouse, the API and the five Sidekiq workers.
# Pulls the published image (pin GROVS_IMAGE in .env); to run from source build
# it first with `docker build -t grovs-backend .` and set GROVS_IMAGE=grovs-backend.
# Configure hosts and secrets in .env (copy .env.example).

x-app: &app
  image: ${GROVS_IMAGE:-ghcr.io/grovs-io/backend:latest}
  env_file:
    - .env
  environment:
    RAILS_ENV: production
    DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-grovs}
    REDIS_URL: redis://redis:6379/0
    CLICKHOUSE_URL: http://grovs:${CLICKHOUSE_PASSWORD:-grovs}@clickhouse:8123
    CLICKHOUSE_DATABASE: grovs_production
    GROVS_SELF_HOSTED: "true"
    ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-local}
    WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
  volumes:
    - storage:/app/storage
  restart: unless-stopped

x-worker: &worker
  <<: *app
  depends_on:
    web:
      condition: service_healthy

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-grovs}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-grovs}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    <<: *app
    # db:prepare creates, migrates and seeds on first boot; clickhouse:setup is idempotent.
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails clickhouse:setup && bundle exec puma -b tcp://0.0.0.0:3000"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  worker_scheduler:
    <<: *worker
    command: bundle exec sidekiq -C config/sidekiq_scheduler.yml

  worker_events:
    <<: *worker
    command: bundle exec sidekiq -C config/sidekiq_worker.yml

  worker_batch:
    <<: *worker
    command: bundle exec sidekiq -C config/sidekiq_batch.yml

  worker_maintenance:
    <<: *worker
    command: bundle exec sidekiq -C config/sidekiq_maintenance.yml

  worker_device_updates:
    <<: *worker
    command: bundle exec sidekiq -C config/sidekiq_device_updates.yml

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_DB: grovs_production
      CLICKHOUSE_USER: grovs
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-grovs}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage:
  clickhouse_data:
