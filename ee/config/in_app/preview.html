<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Grovs preview</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
</style>
</head>
<body>
<script>
(function () {
  "use strict";
  var ALLOWED_ORIGINS = __ALLOWED_ORIGINS__;
  var BRIDGE = __BRIDGE_JS__;
  var DOCTYPE = /^(?:\s|<!--[\s\S]*?-->)*<!doctype[^>]*>/i;
  var frame = null;
  var seq = 0;
  var parentOrigin = null;

  // As JSON inside an inline script: "<" is escaped so the closing script tag can't appear early.
  function literal(value) {
    return JSON.stringify(value).replace(/</g, "\\u003c");
  }

  function makeToken() {
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  // After the doctype, never before it; a page without one gets one, as quirks mode sizes it to its frame.
  function inject(html, data) {
    var boot =
      "window.__grovs={token:" + literal(makeToken()) + ",user:" + literal(data.user) + ",event:" + literal(data.event) + "," +
      "capabilities:" + literal(data.capabilities) + "," +
      // Bound now: the author's script may replace window.parent later.
      "post:(function(){var p=parent;var pm=p.postMessage.bind(p);return function(m){pm(m,\"*\")}})()};";
    var script = "<script>" + boot + BRIDGE + "<\/script>";
    var match = DOCTYPE.exec(html);
    var doctype = match ? match[0] : "";
    return (doctype || "<!doctype html>") + script + html.slice(doctype.length);
  }

  function setScheme(scheme) {
    document.documentElement.style.colorScheme = scheme === "dark" ? "dark" : "light";
  }

  // The nested frame doesn't reliably pick up color-scheme, so force it textually, like the gallery.
  function rewriteColorScheme(html, dark) {
    return html
      .split("(prefers-color-scheme: dark)").join(dark ? "all" : "not all")
      .split("(prefers-color-scheme: light)").join(dark ? "not all" : "all");
  }

  function render(data) {
    seq = data.seq;
    setScheme(data.colorScheme);
    var next = document.createElement("iframe");
    next.title = "Message preview";
    next.setAttribute("sandbox", "allow-scripts");
    next.setAttribute("allow", "autoplay; fullscreen");
    next.style.colorScheme = document.documentElement.style.colorScheme;
    next.srcdoc = inject(rewriteColorScheme(String(data.html), data.colorScheme === "dark"), data);
    var old = frame;
    frame = next;
    document.body.appendChild(next);
    if (old) old.remove();
  }

  function reply(data) {
    // A stale seq answers a render that is already gone; its frame has nothing to reach.
    if (!frame || data.seq !== seq) return;
    var win = frame.contentWindow;
    if (win) win.postMessage(data.message, "*");
  }

  window.addEventListener("message", function (event) {
    if (event.source === window.parent && event.source !== window) {
      if (ALLOWED_ORIGINS.indexOf(event.origin) === -1) return;
      parentOrigin = event.origin;
      var data = event.data;
      if (!data || typeof data !== "object") return;
      if (data.type === "render") render(data);
      else if (data.type === "reply") reply(data);
      return;
    }
    // A call from the message currently shown; an earlier, torn-down frame is never the current one.
    if (frame && event.source === frame.contentWindow && parentOrigin) {
      window.parent.postMessage({ type: "bridge", seq: seq, message: event.data }, parentOrigin);
    }
  });
  // Announces itself, so the dashboard can tell a blocked frame from a slow message.
  ALLOWED_ORIGINS.forEach(function (origin) {
    window.parent.postMessage({ type: "hello" }, origin);
  });
})();
</script>
</body>
</html>
